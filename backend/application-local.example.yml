# Copy to backend/application-local.yml (gitignored) and fill locally.
# Run Maven from backend/. Spring Boot does not automatically load .env files.
spring:
  datasource:
    username: YOUR_LOCAL_DB_USER
    password: YOUR_LOCAL_DB_PASSWORD
app:
  jwt:
    # At least 32 random bytes. Generate locally, e.g. PowerShell:
    # [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
    secret: YOUR_LOCAL_RANDOM_JWT_SECRET
    # access-token-expiration: 1h
# Environment-variable mode is documented in ../README.md. Use one mode at a time.
