spring:
  application:
    name: lost-quest-api
  profiles:
    default: dev
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lost_quest}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          # Instant columns store UTC; Korean display/DB views convert only when reading.
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # One item image (10MB) plus the small JSON "item" part.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  tomcat:
    # Read (and discard) oversized uploads so the client receives the JSON 413 instead of a reset connection.
    max-swallow-size: 20MB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  police-api:
    # 경찰청 OpenAPI (apis.data.go.kr). Keys are set via environment variables or application-local.yml only.
    base-url: ${POLICE_API_BASE_URL:https://apis.data.go.kr/1320000}
    connect-timeout: ${POLICE_API_CONNECT_TIMEOUT:5s}
    # The lost-item list regularly takes 7-9 seconds upstream.
    read-timeout: ${POLICE_API_READ_TIMEOUT:20s}
    lost:
      service-key: ${POLICE_LOST_API_SERVICE_KEY:}
    found:
      service-key: ${POLICE_FOUND_API_SERVICE_KEY:}
    code:
      service-key: ${POLICE_CODE_API_SERVICE_KEY:}
  image-storage:
    # Relative to the working directory (backend/ when run from there). .local/ is gitignored.
    local-dir: ${IMAGE_STORAGE_LOCAL_DIR:./.local/uploads}
  jwt:
    # No default secret: set JWT_SECRET (>= 32 bytes) or app.jwt.secret in application-local.yml.
    secret: ${JWT_SECRET:}
    issuer: lost-quest-api
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
